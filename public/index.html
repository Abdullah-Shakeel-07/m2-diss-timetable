<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Timetable</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='3' fill='white' stroke='%231c2024' stroke-width='2'/%3E%3Cpath d='M3 12h26' stroke='%231c2024' stroke-width='2'/%3E%3Crect x='9' y='17' width='6' height='6' fill='%232457f5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar" class="bar" role="progressbar" aria-label="Loading"></div>
<div class="wrap">
  <header class="top">
    <h1>Timetable</h1>
    <div class="tabs" role="tablist" aria-label="View">
      <button role="tab" data-view="day">Day</button>
      <button role="tab" data-view="week">Week</button>
      <button role="tab" data-view="month">Month</button>
    </div>
  </header>

  <div id="hero" class="status" aria-live="polite"></div>
  <div id="banner" class="banner" hidden></div>

  <nav class="nav">
    <h2 id="label"></h2>
    <div class="ctrl">
      <button id="today" class="btn">Today</button>
      <div class="pair">
        <button id="prev" aria-label="Previous"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
        <button id="next" aria-label="Next"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></button>
      </div>
    </div>
  </nav>

  <main id="view"></main>
  <footer class="foot">Paris time. <span id="updated"></span> <button id="refresh" class="link">Refresh</button></footer>
</div>

<dialog id="modal"><div id="modalBody"></div></dialog>

<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
